name: Temporary ARGOS Mobile 3.2.3 final verified build

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    if: github.head_ref == 'argos-apk-build-20260731'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Download exact preserved source and apply isolated repairs
        run: |
          set -euo pipefail
          mkdir argos-src
          curl --fail --location --retry 5 --retry-all-errors \
            "https://uca436397d0403631abfa582da9c.dl.dropboxusercontent.com/cd/0/get/DFQQiZSVhi2HTOyZZC8gzk7H6iFCenr6CGZFtHX_PIcJ5EQOIvbGFf_ZOZ9Oi1aaNTx7Ad2XphCzmJORuntAsVgwJD0Z0sS2rzQsKCxRzSzyj58J_I4O0khIHwSk7IYWuLjnXp-3ENpbLw3pDH6H6g8xr1KMCJ_3DEEUdIZ-BKtXoA/file?c_luid=12003740" \
            -o /tmp/argos.zip
          test "$(stat -c%s /tmp/argos.zip)" -eq 180620
          sha256sum /tmp/argos.zip | tee /tmp/source-sha256.txt
          unzip -t /tmp/argos.zip
          unzip -q /tmp/argos.zip -d argos-src
          cp argos-build/patch_argos.py argos-src/
          cd argos-src
          python3 patch_argos.py
          grep -q 'applicationId = "com.argos.mobile.multilingual"' app/build.gradle.kts
          grep -q 'versionCode = 30203' app/build.gradle.kts
          grep -q 'versionName = "3.2.3-telemetry-scroll"' app/build.gradle.kts
          grep -q 'panel.addView(telemetryPanel)' app/src/main/java/com/argos/mobile/MainActivity.kt
          grep -q 'overlayView.telemetryPanel = telemetryPanel' app/src/main/java/com/argos/mobile/MainActivity.kt
          grep -q 'LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(widthDp))' app/src/main/java/com/argos/mobile/MainActivity.kt
          ! grep -q 'previewColumn.addView(telemetryPanel)' app/src/main/java/com/argos/mobile/MainActivity.kt
          grep -q 'class CapabilityInspector(private val context: Context)' app/src/main/java/com/argos/mobile/CapabilityInspector.kt
          ! grep -q 'else -> return reason' app/src/main/java/com/argos/mobile/Localization.kt
          ! grep -RIn 'android.permission.INTERNET' app/src/main/AndroidManifest.xml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Unit tests, release lint and release build
        working-directory: argos-src
        run: |
          set -euo pipefail
          mkdir deliverables
          cp /tmp/source-sha256.txt deliverables/SOURCE-SHA256.txt
          gradle --no-daemon --stacktrace :app:testDebugUnitTest 2>&1 | tee deliverables/unit-test.log
          gradle --no-daemon --stacktrace :app:lintRelease 2>&1 | tee deliverables/lint-release.log
          gradle --no-daemon --stacktrace :app:assembleRelease 2>&1 | tee deliverables/assemble-release.log
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          ! grep -Eiq 'BUILD FAILED|Compilation error|Lint found [1-9][0-9]* errors?' deliverables/unit-test.log deliverables/lint-release.log deliverables/assemble-release.log

      - name: Preserve feature boundary
        working-directory: argos-src
        run: |
          set -euo pipefail
          for file in CameraController.kt CapabilityInspector.kt ImuRecorder.kt HmcEngine.kt SessionStore.kt QuicklookStacker.kt Localization.kt TelemetryPanelView.kt; do
            test -f "app/src/main/java/com/argos/mobile/$file"
          done
          grep -q 'cameraController?.captureOne' app/src/main/java/com/argos/mobile/MainActivity.kt
          grep -q 'exportCurrentSession()' app/src/main/java/com/argos/mobile/MainActivity.kt
          grep -q 'buildQuicklookStack()' app/src/main/java/com/argos/mobile/MainActivity.kt
          grep -q 'showHelpDialog()' app/src/main/java/com/argos/mobile/MainActivity.kt
          grep -q 'runCapabilityAudit' app/src/main/java/com/argos/mobile/MainActivity.kt
          grep -q 'overlayView.telemetryPanel = telemetryPanel' app/src/main/java/com/argos/mobile/MainActivity.kt
          ! grep -RInE 'TODO|FIXME|UnsupportedOperationException|NotImplementedError|placeholder logic|mock capture|simulation mode' app/src/main app/src/test

      - name: Align, sign, inspect and checksum APK
        working-directory: argos-src
        run: |
          set -euo pipefail
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          FINAL="deliverables/ARGOS-Mobile-3.2.3-Telemetry-Scrollable-Final.apk"
          "$TOOLS/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk /tmp/argos-aligned.apk
          keytool -genkeypair -noprompt -storetype PKCS12 -keystore /tmp/argos.p12 \
            -storepass argos3232026 -keypass argos3232026 -alias argosmobile \
            -keyalg RSA -keysize 4096 -validity 3650 \
            -dname "CN=ARGOS Mobile 3.2.3,OU=Engineering,O=ARGOS,L=Montreal,ST=Quebec,C=CA"
          "$TOOLS/apksigner" sign --ks /tmp/argos.p12 --ks-key-alias argosmobile \
            --ks-pass pass:argos3232026 --key-pass pass:argos3232026 \
            --out "$FINAL" /tmp/argos-aligned.apk
          "$TOOLS/zipalign" -c -v 4 "$FINAL" | tee deliverables/zipalign.log
          "$TOOLS/apksigner" verify --verbose --print-certs "$FINAL" | tee deliverables/signature.log
          "$TOOLS/aapt" dump badging "$FINAL" | tee deliverables/badging.log
          "$TOOLS/aapt" dump permissions "$FINAL" | tee deliverables/permissions.log
          grep -q "package: name='com.argos.mobile.multilingual' versionCode='30203' versionName='3.2.3-telemetry-scroll'" deliverables/badging.log
          grep -q "launchable-activity: name='com.argos.mobile.MainActivity'" deliverables/badging.log
          ! grep -q 'android.permission.INTERNET' deliverables/permissions.log
          unzip -t "$FINAL" | tee deliverables/zip-integrity.log
          sha256sum "$FINAL" | tee deliverables/APK-SHA256.txt
          cp app/src/main/java/com/argos/mobile/MainActivity.kt deliverables/MainActivity-patched.kt
          cp app/src/main/java/com/argos/mobile/CapabilityInspector.kt deliverables/CapabilityInspector-patched.kt
          cp app/src/main/java/com/argos/mobile/Localization.kt deliverables/Localization-patched.kt
          cp app/build.gradle.kts deliverables/app-build.gradle.kts

      - uses: actions/upload-artifact@v4
        with:
          name: ARGOS-Mobile-3.2.3-verified-apk
          path: argos-src/deliverables/
          if-no-files-found: error
          retention-days: 30
